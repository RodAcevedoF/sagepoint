  #          username: ${{ secrets.VPS_USER }}
  #          key: ${{ secrets.VPS_SSH_KEY }}
  #          port: ${{ secrets.VPS_SSH_PORT }}
  #          source: docker-compose.prod.yml
  #          target: /opt/sagepoint
  #          overwrite: true
  #
  #      - name: Deploy staging to VPS
  #        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
  #        env:
  #          GHCR_USERNAME: ${{ github.actor }}
  #          GHCR_TOKEN: ${{ github.token }}
  #        with:
  #          host: ${{ secrets.VPS_HOST }}
  #          username: ${{ secrets.VPS_USER }}
  #          key: ${{ secrets.VPS_SSH_KEY }}
  #          port: ${{ secrets.VPS_SSH_PORT }}
  #          envs: GHCR_USERNAME,GHCR_TOKEN
  #          script: |
  #            set -e
  #            if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
  #              echo "GHCR credentials are not configured on this repository."
  #              exit 1
  #            fi
  #            cd /opt/sagepoint
  #            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
  #            docker compose -f docker-compose.prod.yml pull api-staging worker-staging
  #            docker compose -f docker-compose.prod.yml up -d api-staging worker-staging
  #            for i in $(seq 1 30); do
  #              docker compose -f docker-compose.prod.yml exec -T api-staging node -e "process.exit(0)" 2>/dev/null && break
  #              sleep 2
  #            done
  #            docker compose -f docker-compose.prod.yml exec -T api-staging node scripts/migrate.js up --author ci
  #            docker compose -f docker-compose.prod.yml exec -T api-staging node scripts/init.js
  #            docker image prune -f || true
  #            docker container prune -f || true
  #            docker builder prune -f --keep-storage=2gb || true

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Sync compose file to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.prod.yml,docker-compose.isolated.yml,deploy/isolated
          target: /opt/sagepoint
          overwrite: true

      - name: Deploy production to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          SAGEPOINT_IMAGE_TAG: prod-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: GHCR_USERNAME,GHCR_TOKEN,SAGEPOINT_IMAGE_TAG
          script: |
            set -e
            if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR credentials are not configured on this repository."
              exit 1
            fi
            cd /opt/sagepoint
            test -s .env
            test -s .env.application
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull api worker
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 api worker
            docker compose -f docker-compose.prod.yml exec -T api node scripts/migrate.js up --author ci
            docker compose -f docker-compose.prod.yml exec -T api node scripts/init.js
            sed -i "s/^SAGEPOINT_IMAGE_TAG=.*/SAGEPOINT_IMAGE_TAG=$SAGEPOINT_IMAGE_TAG/" .env

      - name: Merge release branch into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout master
          git merge --ff-only ${{ github.ref_name }}
          git push origin master
