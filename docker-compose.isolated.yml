name: sagepoint-isolated

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  restart: unless-stopped
  env_file: ${SAGEPOINT_APP_ENV_FILE:-.env.production}
  environment: &app-environment
    NODE_ENV: production
    DATABASE_URL: postgresql://sagepoint:${SAGEPOINT_POSTGRES_PASSWORD:?Set a URL-safe database password}@postgres:5432/sagepoint?schema=public
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_USERNAME: sagepoint
    REDIS_PASSWORD: ${SAGEPOINT_REDIS_PASSWORD:?Set the Redis application password}
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${SAGEPOINT_NEO4J_PASSWORD:?Set the Neo4j password}
  volumes:
    - type: bind
      source: ${GCP_KEY_PATH:-./gcp-key.json}
      target: /app/gcp-key.json
      read_only: true
      bind:
        create_host_path: false
  networks:
    - backend
    - egress
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  logging: *logging

services:
  api:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/rodacevedof/sagepoint}-api:${SAGEPOINT_IMAGE_TAG:?Set a validated prod-commit image tag}
    environment:
      <<: *app-environment
      PORT: "3001"
    ports:
      - "127.0.0.1:${SAGEPOINT_API_PORT:-3001}:3001"
    stop_grace_period: 30s
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/rodacevedof/sagepoint}-worker:${SAGEPOINT_IMAGE_TAG:?Set a validated prod-commit image tag}
    stop_grace_period: 120s
    mem_limit: 512m

  worker-2:
    <<: *app
    image: ${IMAGE_PREFIX:-ghcr.io/rodacevedof/sagepoint}-worker:${SAGEPOINT_IMAGE_TAG:?Set a validated prod-commit image tag}
    profiles: [scale]
    stop_grace_period: 120s
    mem_limit: 512m

  postgres:
    image: ${SAGEPOINT_POSTGRES_IMAGE:?Set the validated pgvector PostgreSQL 17 image}
    restart: unless-stopped
    environment:
      POSTGRES_DB: sagepoint
      POSTGRES_USER: sagepoint_admin
      POSTGRES_PASSWORD: ${SAGEPOINT_POSTGRES_ADMIN_PASSWORD:?Set the PostgreSQL administration password}
      SAGEPOINT_POSTGRES_PASSWORD: ${SAGEPOINT_POSTGRES_PASSWORD:?Set a URL-safe database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/isolated/postgres-init.sql:/docker-entrypoint-initdb.d/10-sagepoint.sql:ro
    networks:
      - backend
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sagepoint_admin", "-d", "sagepoint"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: ${SAGEPOINT_REDIS_IMAGE:?Set the validated Redis 7 image}
    restart: unless-stopped
    entrypoint: ["sh", "/opt/sagepoint/redis-start.sh"]
    environment:
      SAGEPOINT_REDIS_PASSWORD: ${SAGEPOINT_REDIS_PASSWORD:?Set the Redis application password}
      SAGEPOINT_REDIS_RECOVERY_PASSWORD: ${SAGEPOINT_REDIS_RECOVERY_PASSWORD:?Set the Redis recovery password}
    volumes:
      - redis_data:/data
      - ./deploy/isolated/redis-start.sh:/opt/sagepoint/redis-start.sh:ro
    networks:
      - backend
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --user health --pass '' --no-auth-warning --raw ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  neo4j:
    image: ${SAGEPOINT_NEO4J_IMAGE:?Set the validated Neo4j 5 Community image}
    restart: unless-stopped
    entrypoint: ["bash", "/opt/sagepoint/neo4j-start.sh"]
    environment:
      NEO4J_AUTH: neo4j/${SAGEPOINT_NEO4J_PASSWORD:?Set the Neo4j password}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./deploy/isolated/neo4j-start.sh:/opt/sagepoint/neo4j-start.sh:ro
    networks:
      - backend
    mem_limit: 1g
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "NEO4J_USERNAME=neo4j NEO4J_PASSWORD=\"$${NEO4J_AUTH#neo4j/}\" cypher-shell -a bolt://127.0.0.1:7687 'RETURN 1' > /dev/null"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5
    logging: *logging

networks:
  backend:
    internal: true
  egress: {}

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
